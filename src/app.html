<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		%sveltekit.head%
		<link rel="stylesheet" href="https://use.typekit.net/izw5ghp.css" />
	</head>
	<style>
		:root {
			font-family:
				greycliff-cf,
				system-ui,
				-apple-system,
				BlinkMacSystemFont,
				'Segoe UI',
				Roboto,
				Oxygen,
				Ubuntu,
				Cantarell,
				'Open Sans',
				'Helvetica Neue',
				sans-serif;

			/* theme colors */
			--color-accent: light-dark(#4868a9, #c5dbff);
			--color-accent-dark: #1f2c47;
			--color-accent-bg: light-dark(#ecf3ff, #303030);
			--color-accent-bg-active: light-dark(#d6e2ff, #3a3a3a);
			--color-text: light-dark(#1a1a1a, #f0f0f0);
			--color-muted: light-dark(#555, #b5b5b5);
			--color-border: light-dark(#ccc, #333);
			--color-surface: light-dark(white, #212121);

			/* corner radii */
			--radius-button: 0.1875rem;
			--radius-button: 0;
			--radius-surface: 0.25rem;
			--radius-surface: 0;
		}

		html {
			background-color: var(--color-surface);
		}

		body {
			margin: 0;
			background-color: transparent !important;
		}
	</style>
	<body data-sveltekit-preload-data="off">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
